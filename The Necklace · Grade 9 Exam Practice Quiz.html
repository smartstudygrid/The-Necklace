<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Necklace — Grade 9 Exam Practice</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#14213d;--gold:#c9a24a;--bg:#faf6ec;--card:#fff;--ink:#1f2937;--mut:#6b7280;--line:#e6dcc3;--hd:#14213d;--ok:#1b7f4b;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#172038;--ink:#e8e9ee;--mut:#9aa3b5;--line:#2a3550;--hd:#e8d9a8;--ok:#4cc38a;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#172038;--ink:#e8e9ee;--mut:#9aa3b5;--line:#2a3550;--hd:#e8d9a8;--ok:#4cc38a;--bad:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,Arial,sans-serif;line-height:1.55}
.top{background:var(--navy);color:#fff;border-bottom:4px solid var(--gold);padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:1.6rem;margin:0}
.top small{color:#e8d9a8;letter-spacing:.07em;text-transform:uppercase;font-size:.7rem;display:block}
#timer{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:600}
main{max-width:820px;margin:0 auto;padding:22px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 2px 8px rgba(20,33,61,.07);margin-bottom:16px}
h2{font-family:'Instrument Serif',Georgia,serif;font-weight:400;color:var(--hd);font-size:1.8rem;margin:0 0 8px}
h3{color:var(--hd);margin:0 0 8px;font-size:1.05rem}
label{display:block;font-size:.8rem;font-weight:600;color:var(--mut);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.05em}
input,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,textarea:focus{outline:2px solid var(--gold)}
textarea{min-height:170px;resize:vertical}
.btn{background:var(--navy);color:var(--gold);border:0;border-radius:9px;padding:11px 22px;font:600 .95rem Inter,sans-serif;cursor:pointer}
.btn.alt{background:transparent;color:var(--hd);border:1px solid var(--gold)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.opt{display:block;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--gold)}
.opt.sel{border-color:var(--gold);background:var(--navy);color:#fff}
.opt b{color:var(--gold);margin-right:8px}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--gold)}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.dots button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 .75rem Inter;cursor:pointer}
.dots .done{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.dots .cur{outline:2px solid var(--hd)}
.cat{font-size:.7rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;background:var(--navy);color:var(--gold);padding:3px 10px;border-radius:99px}
.q{font-family:'Instrument Serif',Georgia,serif;font-size:1.4rem;color:var(--hd);margin:12px 0 4px;line-height:1.35}
.hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.ring{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--line) 0)}
.ring span{width:100px;height:100px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:'Instrument Serif',Georgia,serif;font-size:2rem;color:var(--hd)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;font-size:.85rem;color:var(--mut)}
.meta b{display:block;color:var(--ink)}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
.rev{border-left:4px solid var(--line);padding:2px 0 2px 14px;margin:14px 0}
.rev.r{border-color:var(--ok)}.rev.w{border-color:var(--bad)}
.rev p{margin:3px 0;font-size:.92rem}
.model{background:var(--bg);border-left:4px solid var(--gold);padding:12px 14px;border-radius:8px;font-size:.92rem}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;margin:7px 0;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
.chk input{width:auto;margin-top:4px}
footer{text-align:center;color:var(--mut);font-size:.75rem;padding:16px}
@media(max-width:560px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}}
@media print{.top .btn,.noprint{display:none!important}body{background:#fff;color:#000}.card{box-shadow:none;break-inside:avoid}.top{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div class="top"><div><small>Al-Rowad International Schools · English Department</small><h1>The Necklace · Grade 9 Exam Practice</h1></div><div id="timer"></div></div>
<main id="app"></main>
<footer>Designed by Amanullah Khan, Head of English Dept · Story by Guy de Maupassant</footer>
<script>
const Q=[
{c:'Plot',q:'What is Monsieur Loisel\'s job?',o:['A clerk at the Ministry of Public Instruction','A jeweler at the Palais Royal','A cab driver in Paris','A minister\'s secretary'],e:'He is described as "a little clerk of the Ministry of Public Instruction", which explains the family\'s modest income.'},
{c:'Plot',q:'Why does Loisel turn pale when Mathilde asks for 400 francs?',o:['He was saving exactly that amount to buy a gun','He thinks the gown is too expensive for the ball','He has already lent the money to a friend','He wants her to wear natural flowers instead'],e:'He had set aside 400 francs for a gun and a shooting trip. He still gives it up for her, showing his generosity.'},
{c:'Plot',q:'Who lends Mathilde the diamond necklace?',o:['Madame Forestier, a rich former convent schoolmate','Madame Ramponneau, the Minister\'s wife','Her mother','A jeweler at the Palais Royal'],e:'Madame Forestier is the wealthy friend Mathilde avoids visiting because it makes her sad.'},
{c:'Plot',q:'After losing the necklace, what do the Loisels tell Madame Forestier?',o:['That the clasp is broken and being mended','That the necklace was stolen','That they have sold it','That they need a few more weeks to find it'],e:'The lie that the clasp was being mended bought them time to find a replacement.'},
{c:'Plot',q:'How much do the Loisels finally pay for the replacement necklace?',o:['36,000 francs','40,000 francs','18,000 francs','500 francs'],e:'It was worth 40,000 francs but they bargained it down to 36,000. Loisel used his 18,000 inheritance and borrowed the rest.'},
{c:'Vocabulary',q:'"She threw the invitation on the table crossly." What does "crossly" mean?',o:['In an irritated, annoyed way','In a clumsy, careless way','In a joyful, excited way','In a secretive, quiet way'],e:'Mathilde is angry rather than delighted, so "crossly" means annoyed. Context clues: "Instead of being delighted".'},
{c:'Vocabulary',q:'"He dealt with usurers and all the race of lenders." What are usurers?',o:['Lenders who charge extremely high interest','Jewelers who sell fake diamonds','Clerks who work at the ministry','Friends who give gifts of money'],e:'The context (borrowing, notes, "ruinous obligations") shows they lend money at unfairly high rates.'},
{c:'Inference',q:'Why does Mathilde fear that Madame Forestier will open the case when it is returned?',o:['She would discover the substitution and might think Mathilde a thief','She would see that the clasp was still broken','She would want to wear the necklace that night','She would notice the case had been repainted'],e:'The narrator says that if the replacement were detected, Mathilde would be taken "for a thief". This shows her fear of shame.'},
{c:'Inference',q:'Loisel sleeps in an anteroom while his wife dances all night. What does this suggest?',o:['He is selfless and has no interest in the glamour she craves','He dislikes his wife and avoids her','He is angry that she is spending money','He is waiting to speak to the minister'],e:'Loisel is happy with simple things (he loves "the good soup") and lets Mathilde enjoy her night. This contrasts with her desire for luxury.'},
{c:'Character',q:'Which description best fits Mathilde at the start of the story?',o:['Beautiful but dissatisfied and envious of luxury','Modest, content and generous','Shy, quiet and unaware of her beauty','Ambitious and hard-working'],e:'She "suffered ceaselessly" and felt "born to enjoy all delicacies and all luxuries".'},
{c:'Character',q:'How has Mathilde changed after ten years of paying the debt?',o:['She is worn and rough but shows strength and pride in paying it','She is bitter and blames her husband','She is richer and more elegant','She is unchanged in appearance and attitude'],e:'She "looked old" and became "strong and hard and rough", yet she faced the debt with "sudden heroism" and smiles "proud and ingenuous" at the end.'},
{c:'Language & Devices',q:'"How small a thing is needed to make or ruin us!" What does this narrator comment emphasize?',o:['The role of fate and chance in people\'s lives','The importance of expensive clothing','The kindness of Madame Forestier','The danger of walking at night'],e:'The narrator reflects that one small event (losing a necklace) changed everything, supporting the theme of fate and chance.'},
{c:'Language & Devices',q:'The ending, where the necklace is revealed to be paste, is an example of:',o:['Situational irony','Personification','Alliteration','Flashback'],e:'The result is the opposite of what we expect: ten years of sacrifice were for a nearly worthless item.'},
{c:'Themes',q:'Which theme is most strongly supported by the story\'s ending?',o:['Appearances can be deceiving','Wealth always brings happiness','Hard work is never rewarded','Friendship is more important than family'],e:'The fake necklace looks real, just as Mathilde looks rich at the ball. Nothing is what it seems.'},
{c:'Themes',q:'What does the story suggest about vanity and honesty?',o:['Pride and fear of admitting a mistake can turn a small problem into a disaster','Telling lies is a good way to solve problems','Borrowing from friends is always unwise','Only the rich are generous'],e:'If Mathilde had told Madame Forestier the truth, the debt, and the ten years of hardship, might have been avoided.'}
];
const TIPS={'Plot':'Re-read the story and make a numbered timeline of events. Note who does what and why.','Vocabulary':'Use context clues: look at the sentence around an unfamiliar word and ask what the writer is describing.','Inference':'Ask "What does this detail suggest?" and support your answer with a short quotation.','Character':'Track how a character\'s words, actions and appearance change from start to end.','Language & Devices':'Learn key terms (irony, foreshadowing, narration) and practise explaining their effect, not just naming them.','Themes':'Connect events to big ideas: vanity, class, fate, honesty and appearance vs. reality.'};
const RUB=['States a clear point about how irony shapes the story\'s message','Uses evidence (the paste necklace twist, ten years of repayment, 36,000 francs)','Names situational irony or explains that the outcome is the opposite of what was expected','Links the consequences to Mathilde\'s vanity or to appearance vs. reality'];
const MODEL='Maupassant uses situational irony in the ending to show the cost of Mathilde\'s vanity. Throughout the story she longs for luxury and status, so she borrows a diamond necklace to look rich at the ball. After she loses it, the couple spend ten years in poverty repaying 36,000 francs for a replacement. The final twist, that the original was paste worth only 500 francs, is ironic because all their sacrifice was for something almost worthless. This reveals that appearances can be deceiving, and that Mathilde\'s pride and desire to seem wealthy ruined her life. Her fear of admitting the loss made things worse, suggesting honesty could have saved them.';
const WQ='In one paragraph (5–6 sentences), explain how Maupassant uses irony and the ending of the story to show the consequences of Mathilde\'s vanity. Use at least one detail from the story.';
const $=s=>document.querySelector(s),app=$('#app'),esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={info:{},qs:[],ans:[],i:0,w:'',t0:0,tick:null,rub:[0,0,0,0]};
const L='ABCD';
function start(){
 app.innerHTML=`<div class="card"><h2>Welcome</h2><p>This practice test covers <b>Guy de Maupassant's "The Necklace"</b>: ${Q.length} multiple-choice questions and one written response (19 marks in total). You will receive a detailed feedback report at the end. Enter your details to begin.</p>
 <label for="n">Full name *</label><input id="n" autocomplete="name">
 <label for="c">Class / Section *</label><input id="c" placeholder="e.g. Grade 9-B">
 <label for="id">Student ID (optional)</label><input id="id">
 <label for="t">English teacher (optional)</label><input id="t">
 <p id="err" class="bad"></p><div class="row"><span></span><button class="btn" id="go">Start the quiz</button></div></div>
 <div class="card"><h3>Instructions</h3><ul><li>Choose one answer for each question. You can move back and change answers.</li><li>The written task is scored with a checklist after you submit.</li><li>Answers and explanations appear only in your final report, as in a real exam.</li></ul></div>`;
 $('#go').onclick=()=>{const n=$('#n').value.trim(),c=$('#c').value.trim();if(!n||!c){$('#err').textContent='Please enter your name and class to begin.';return}
  S.info={n,c,id:$('#id').value.trim(),t:$('#t').value.trim()};
  S.qs=Q.map(q=>{const ix=q.o.map((_,k)=>k).sort(()=>Math.random()-.5);return{...q,opts:ix.map(k=>q.o[k]),cor:ix.indexOf(0)}});
  S.ans=Q.map(()=>-1);S.i=0;S.w='';S.rub=[0,0,0,0];S.t0=Date.now();clearInterval(S.tick);
  S.tick=setInterval(()=>{const s=Math.floor((Date.now()-S.t0)/1000);$('#timer').textContent='⏱ '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);quiz()};
}
function dots(){return `<div class="dots">${S.qs.map((_,k)=>`<button class="${S.ans[k]>=0?'done':''} ${k==S.i?'cur':''}" onclick="S.i=${k};quiz()">${k+1}</button>`).join('')}<button class="${S.i==S.qs.length?'cur':''}" onclick="S.i=${S.qs.length};quiz()">✎</button></div>`}
function quiz(){
 window.scrollTo(0,0);
 if(S.i>=S.qs.length)return written();
 const q=S.qs[S.i],done=S.ans.filter(a=>a>=0).length;
 app.innerHTML=`<div class="card">${dots()}<div class="bar"><i style="width:${done/S.qs.length*100}%"></i></div>
 <span class="cat">${q.c}</span> <span style="color:var(--mut);font-size:.8rem;margin-left:8px">Question ${S.i+1} of ${S.qs.length} · ${done} answered</span>
 <div class="q">${esc(q.q)}</div>
 ${q.opts.map((o,k)=>`<button class="opt ${S.ans[S.i]==k?'sel':''}" onclick="S.ans[S.i]=${k};quiz()"><b>${L[k]}</b>${esc(o)}</button>`).join('')}
 <div class="row"><button class="btn alt" ${S.i?'':'disabled'} onclick="S.i--;quiz()">← Previous</button><button class="btn" onclick="S.i++;quiz()">${S.i==S.qs.length-1?'Written task →':'Next →'}</button></div></div>`;
}
function written(){
 const un=S.ans.filter(a=>a<0).length;
 app.innerHTML=`<div class="card">${dots()}<span class="cat">Written response</span><div class="q">${esc(WQ)}</div>
 <textarea id="w" placeholder="Write your paragraph here...">${esc(S.w)}</textarea><p id="wc" style="color:var(--mut);font-size:.8rem"></p>
 ${un?`<p class="bad">You have ${un} unanswered multiple-choice question${un>1?'s':''}. Use the numbered buttons to go back.</p>`:''}
 <div class="row"><button class="btn alt" onclick="S.i--;quiz()">← Previous</button><button class="btn" id="sub">Submit &amp; get my report</button></div></div>`;
 const w=$('#w'),u=()=>{S.w=w.value;$('#wc').textContent=(w.value.trim()?w.value.trim().split(/\s+/).length:0)+' words'};w.oninput=u;u();
 $('#sub').onclick=()=>{S.end=Date.now();clearInterval(S.tick);report()};
}
function band(p){return p>=90?['Outstanding','Exceptional understanding. You are working at the top of the Grade 9 range.']:p>=80?['Excellent','Strong, secure understanding with only a few gaps to polish.']:p>=70?['Proficient','A solid grasp of the story. Targeted revision will lift you to the next level.']:p>=55?['Developing','You understand the main ideas, but detail and analysis need strengthening.']:['Needs Support','Re-read the story carefully and revise key events, characters and themes with your teacher.']}
function report(){
 window.scrollTo(0,0);
 const mc=S.qs.reduce((s,q,k)=>s+(S.ans[k]==q.cor?1:0),0),cats={};
 S.qs.forEach((q,k)=>{(cats[q.c]=cats[q.c]||{r:0,t:0}).t++;if(S.ans[k]==q.cor)cats[q.c].r++});
 const secs=Math.round((S.end-S.t0)/1000),tm=Math.floor(secs/60)+' min '+secs%60+' s',d=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
 const pc=mc/S.qs.length*100,strong=Object.keys(cats).filter(k=>cats[k].r/cats[k].t>=.8),weak=Object.keys(cats).filter(k=>cats[k].r/cats[k].t<.6);
 const wc=S.w.trim()?S.w.trim().split(/\s+/).length:0;
 app.innerHTML=`<div class="card hero"><div class="ring" id="ring"><span id="tot"></span></div><div><h2>${esc(S.info.n)}</h2><div id="bd"></div></div></div>
 <div class="card"><div class="meta"><div><b>${esc(S.info.c)}</b>Class</div>${S.info.id?`<div><b>${esc(S.info.id)}</b>Student ID</div>`:''}${S.info.t?`<div><b>${esc(S.info.t)}</b>Teacher</div>`:''}<div><b>${d}</b>Date</div><div><b>${tm}</b>Time taken</div><div><b>${mc} / ${S.qs.length}</b>Multiple choice</div></div></div>
 <div class="card"><h3>Skills breakdown</h3>${Object.keys(cats).map(k=>{const p=Math.round(cats[k].r/cats[k].t*100);return `<div style="display:flex;justify-content:space-between;font-size:.9rem"><span>${k}</span><span>${cats[k].r}/${cats[k].t} · ${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div>`}).join('')}</div>
 <div class="card"><h3>Teacher-style feedback</h3><p id="cm"></p>
 <p><b class="ok">Strengths:</b> ${strong.length?strong.join(', ')+'. Keep using these skills in your written answers.':'Keep practising; your strengths will emerge as you revise.'}</p>
 <p><b class="bad">Focus areas:</b> ${weak.length?'':'None this time. Challenge yourself with longer analytical answers.'}</p>
 ${weak.map(k=>`<p style="margin:4px 0"><b>${k}:</b> ${TIPS[k]}</p>`).join('')}
 <p><b>Next steps:</b> (1) Read every explanation below, especially for questions you missed. (2) Re-read the story and annotate quotations on vanity and irony. (3) Rewrite your paragraph using the model answer as a guide, then retake the quiz.</p></div>
 <div class="card"><h3>Written response</h3><p style="color:var(--mut);font-size:.9rem">${esc(WQ)}</p><div class="model" style="border-color:var(--line);margin-bottom:12px"><b>Your answer (${wc} words):</b><br>${S.w.trim()?esc(S.w).replace(/\n/g,'<br>'):'<i>No answer submitted.</i>'}</div>
 <div class="model"><b>Model answer</b><br>${MODEL}</div>
 <h3 style="margin-top:16px">Self-assess against the checklist (1 mark each)</h3>${RUB.map((r,k)=>`<label class="chk"><input type="checkbox" ${S.rub[k]?'checked':''} onchange="S.rub[${k}]=this.checked?1:0;upd()">${r}</label>`).join('')}
 <p id="wf" style="font-size:.9rem"></p></div>
 <div class="card"><h3>Question review</h3>${S.qs.map((q,k)=>{const ok=S.ans[k]==q.cor;return `<div class="rev ${ok?'r':'w'}"><p><b>${k+1}. ${esc(q.q)}</b></p><p>Your answer: <span class="${ok?'ok':'bad'}">${S.ans[k]>=0?esc(q.opts[S.ans[k]]):'Not answered'}</span> ${ok?'✓':'✗'}</p>${ok?'':`<p>Correct answer: <span class="ok">${esc(q.opts[q.cor])}</span></p>`}<p style="color:var(--mut)">${esc(q.e)}</p></div>`}).join('')}</div>
 <div class="row noprint"><button class="btn alt" onclick="start()">Retake (new student / attempt)</button><button class="btn" onclick="window.print()">Print / Save report as PDF</button></div>`;
 window.upd=()=>{const r=S.rub.reduce((a,b)=>a+b,0),t=mc+r,p=Math.round(t/(S.qs.length+4)*100),b=band(p);
  $('#tot').textContent=t+'/'+(S.qs.length+4);$('#ring').style.setProperty('--p',p);
  $('#bd').innerHTML=`<div style="font-size:1.3rem;font-weight:600;color:var(--hd)">${b[0]} · ${p}%</div><p style="margin:4px 0 0">${b[1]}</p>`;
  $('#cm').innerHTML=`Dear ${esc(S.info.n.split(' ')[0])}, you scored <b>${t} out of ${S.qs.length+4}</b> (${p}%), which places you in the <b>${b[0]}</b> band. ${pc>=80?'Your recall and interpretation of the text are impressive.':pc>=55?'You show a reasonable understanding of the story, and careful rereading will close the remaining gaps.':'Do not be discouraged: this report shows exactly where to focus your revision.'} ${S.w.trim().split(/\s+/).length<40?'Your written response was brief; aim for 5-6 developed sentences with evidence.':'You made a good effort on the written task; keep linking evidence to the writer\'s message.'}`;
  $('#wf').innerHTML=`Written task: <b>${r} / 4</b>. Tick honestly; this updates your total score above.`};
 upd();
}
start();
</script>
</body>
</html>
